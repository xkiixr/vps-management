name: vpsm

# The control plane's own logs are rotated like the apps' (10 MB x 3 per container).
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# The memory limits of everything together exceed 8 GB by design (see docs/operations.md). When the host
# runs out, the kernel must kill a user app (oom_score_adj 500) or a build (0) before the control plane, so
# postgres, traefik, the worker and the dashboard get -900, plus a reservation (cgroup memory.low) the kernel
# avoids reclaiming from them under pressure.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    oom_score_adj: -900
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # postgres 18 keeps its data in a versioned directory under /var/lib/postgresql.
      - vpsm-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - control

  # Do not add forwardedHeaders.insecure or forwardedHeaders.trustedIPs to an entrypoint below. Left at the
  # default, Traefik discards the X-Forwarded-For a client sends and sets its own, and the dashboard's login
  # limiter trusts the first entry of that header as the client's address. And the web service must never
  # publish a port: Traefik is the only way in.
  traefik:
    image: traefik:v3.7
    container_name: vpsm-traefik
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    oom_score_adj: -900
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - vpsm-acme:/acme
      - vpsm-traefik-dynamic:/traefik/dynamic:ro
    # Routes come from files the worker writes into the dynamic directory. The API and dashboard stay off.
    command:
      - --providers.file.directory=/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
    # The worker connects this container to each project's network when it deploys.
    networks:
      - edge

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: vpsm-worker
    restart: unless-stopped
    # A minimal init as PID 1 reaps the git, railpack and docker processes the worker spawns.
    init: true
    mem_limit: 768m
    mem_reservation: 256m
    oom_score_adj: -900
    logging: *logging
    stop_grace_period: 60s
    env_file: .env
    volumes:
      # Root-equivalent access to the host. The worker is the only service that gets the socket, and it publishes no ports.
      - /var/run/docker.sock:/var/run/docker.sock
      - vpsm-traefik-dynamic:/traefik/dynamic
      - vpsm-work:/var/lib/vpsm/work
    depends_on:
      postgres:
        condition: service_healthy
    # Healthy once this run of the worker has migrated the database and finished its recovery (it writes the
    # file then, see apps/worker/src/ready.ts). The web service waits for that.
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/vpsm-worker-ready']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 120s
    networks:
      - control

  # The dashboard, at https://PANEL_DOMAIN. The worker writes its Traefik route, so it is reached through Traefik
  # only: it never publishes a port, and it gets no Docker socket (it talks to the database and nothing else).
  # It does not start before the worker has migrated the database.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vpsm-web
    restart: unless-stopped
    # A minimal init as PID 1 passes the stop signal on and reaps leftover processes.
    init: true
    mem_limit: 512m
    mem_reservation: 128m
    oom_score_adj: -900
    logging: *logging
    env_file: .env
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN in .env (for example panel.apps.example.com)}
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # control reaches postgres; edge is where Traefik reaches the dashboard (PANEL_UPSTREAM, http://vpsm-web:3000).
    networks:
      - control
      - edge

networks:
  control:
    name: vpsm-control
  edge:
    name: vpsm-edge

volumes:
  vpsm-pgdata:
    name: vpsm-pgdata
  vpsm-acme:
    name: vpsm-acme
  vpsm-traefik-dynamic:
    name: vpsm-traefik-dynamic
  vpsm-work:
    name: vpsm-work
