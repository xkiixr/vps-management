services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - '54329:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
